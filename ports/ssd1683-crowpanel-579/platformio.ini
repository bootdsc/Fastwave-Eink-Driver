; CrowPanel 5.79" fast-waveform lab — dual SSD1683
;
;   python -m platformio run -d .
;   python -m esptool --chip esp32s3 -p COM18 -b 460800 --before default-reset \
;       --after hard-reset write-flash --flash-mode dio --flash-freq 80m \
;       --flash-size 8MB 0x0 .pio\build\wavelab\firmware.factory.bin
;
; Serial 115200. See docs/SSD1683-FAST-WAVEFORM.md before changing anything.

[platformio]
default_envs = wavelab
src_dir = firmware

[env:wavelab]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 8MB
board_build.partitions = huge_app.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=0

build_src_filter =
    +<wavelab.cpp>
    +<waveform.cpp>
    +<EPD.cpp>
    +<EPD_Init.cpp>
    +<spi.cpp>
