; Seeed 4.26" 800x480 ePaper (GDEQ0426T82 / SSD1677) on XIAO ESP32-S3
;
;   python -m platformio run -d .
;   python -m esptool --chip esp32s3 -p COM19 -b 460800 --before default-reset \
;       --after hard-reset write-flash --flash-mode dio --flash-freq 80m \
;       --flash-size 8MB 0x0 .pio\build\xiao426\firmware.factory.bin
;
; Serial 115200. See ../../docs/WAVEFORM-LAW.md for the SSD16xx background —
; the 0x22 bitfield, the rails-up trick and the calib/seqscan probes all apply,
; with one meaning changed: on SSD1677 bit 3 selects DISPLAY Mode 1 vs Mode 2,
; not 3-color vs black/white.

[platformio]
default_envs = xiao426
src_dir = firmware

[env:xiao426]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 460800

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0

build_src_filter =
    +<main.cpp>
    +<ssd1677.cpp>
    +<wave1677.cpp>
    +<spi.cpp>
