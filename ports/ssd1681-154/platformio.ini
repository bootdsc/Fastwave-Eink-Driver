; SSD1681 1.54" 200x200 mono on a XIAO ESP32-S3.
;
;   python -m platformio run -d .
;   python ../../tools/flash.py COMx xiao-154
;
; Serial 115200, native TinyUSB CDC.
; Read ../../docs/panels/SSD1681-1.54.md before changing a waveform byte.
;
; Check the FPC pinout against your breakout before plugging the glass in.
; A 24-pin e-paper connector is not a standard.

[platformio]
default_envs = xiao-154
src_dir = firmware

[env:xiao-154]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_upload.flash_size = 8MB
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes
build_flags =
    -DBOARD_154
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
build_src_filter =
    +<inkvideo_154.cpp>
    +<ssd1681.cpp>
    +<wave1681.cpp>
    +<spi.cpp>
